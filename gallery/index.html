<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2UI Runtime — Live Gallery</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --panel-2: #2d2d30;
      --border: #454545;
      --fg: #e0e0e0;
      --fg-dim: #a0a0a0;
      --accent: #0e70c0;
      --accent-fg: #ffffff;
      /* VS Code theme vars the runtime reads; provided here so it themes cleanly. */
      --vscode-font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      --vscode-foreground: var(--fg);
      --vscode-widget-border: var(--border);
      --vscode-editorWidget-background: #2a2a2b;
      --vscode-button-background: var(--accent);
      --vscode-button-foreground: var(--accent-fg);
      --vscode-button-hoverBackground: #1177bb;
      --vscode-input-background: #3c3c3c;
      --vscode-input-foreground: var(--fg);
      --vscode-input-border: var(--border);
      --vscode-progressBar-background: var(--accent);
      --vscode-focusBorder: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--vscode-font-family);
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas: "header header" "sidebar main";
    }
    header {
      grid-area: header;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header .sub { font-size: 12px; color: var(--fg-dim); }
    #sidebar {
      grid-area: sidebar;
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 8px;
    }
    .example {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }
    .example:hover { background: var(--panel-2); }
    .example.active { background: var(--panel-2); border-color: var(--accent); }
    .example .title { font-size: 13px; font-weight: 600; }
    .example .blurb { font-size: 11px; color: var(--fg-dim); margin-top: 3px; line-height: 1.35; }
    #main {
      grid-area: main;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .pane {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .pane-head {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pane-body { padding: 16px; }
    #render-host { min-height: 60px; }
    button.toggle {
      background: var(--panel-2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    button.toggle:hover { border-color: var(--accent); }
    pre#source {
      margin: 0;
      padding: 14px;
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #cdd6e0;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 320px;
      overflow-y: auto;
    }
    #source-pane[hidden] { display: none; }
    #log {
      margin: 0;
      padding: 12px 14px;
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 11.5px;
      line-height: 1.5;
      max-height: 220px;
      overflow-y: auto;
      color: var(--fg-dim);
    }
    #log .entry { margin-bottom: 2px; }
    #log .INTERACTION { color: #f0a15a; }
    #log .READY { color: #3fb950; }
    #log .RESIZE { color: #7aa2f7; }
    #log .HOST { color: #58a6ff; }
    #log .empty { font-style: italic; }
    .badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--fg-dim);
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>A2UI Runtime</h1>
    <span class="sub">Live gallery — the real webview runtime driven by a fake host transport</span>
  </header>

  <nav id="sidebar" aria-label="Examples"></nav>

  <div id="main">
    <div class="pane">
      <div class="pane-head">
        <span id="render-title">Render</span>
        <span id="target-badge" class="badge"></span>
      </div>
      <div class="pane-body">
        <div id="render-host"></div>
      </div>
    </div>

    <div class="pane" id="source-pane" hidden>
      <div class="pane-head">
        <span>Document JSON</span>
      </div>
      <pre id="source"></pre>
    </div>

    <div class="pane">
      <div class="pane-head">
        <span>Message log (inset &rarr; host)</span>
        <button class="toggle" id="toggle-source" type="button">Toggle source</button>
      </div>
      <pre id="log"><span class="entry empty">Select an example to mount the runtime…</span></pre>
    </div>
  </div>

  <!-- The real webview bundle. Exposes window.A2uiRuntime.mountRuntime(root, transport).
       (bootstrapFromVsCodeApi is a no-op here because acquireVsCodeApi is absent.) -->
  <script src="../dist/runtime.iife.js"></script>
  <script type="module" src="./gallery.js"></script>
</body>
</html>
